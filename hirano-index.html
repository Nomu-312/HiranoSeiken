<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <title>Spotify Music</title>
 
  <link rel="stylesheet" href="hirano-style.css">
</head>
 
<body>
 
  <header>
    <h1>🎵 Spotify Music</h1>
 
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="曲名・アーティスト名を入力"
      >
      <button onclick="searchMusic()">検索</button>
    </div>
  </header>
 
  <main>
 
    <!-- 検索結果 -->
    <section>
      <h2>検索結果</h2>
      <div id="searchResults" class="card-container"></div>
    </section>
 
    <!-- 曲 TOP5 -->
    <section>
      <h2>🎵 曲 TOP5</h2>
      <div id="popularSongs"></div>
    </section>
 
    <!-- アーティスト TOP5 -->
    <section>
      <h2>👤 アーティスト TOP5</h2>
      <div id="popularArtists"></div>
    </section>
 
    <!-- アルバム TOP5 -->
    <section>
      <h2>💿 アルバム TOP5</h2>
      <div id="popularAlbums"></div>
    </section>
   
    <section id="gachaSection">
  <h2>🎰 今日の1曲ガチャ</h2>

  <p>好きなジャンルを選んで、今日の1曲を引き当てよう！</p>

  <select id="gachaGenre">
    <option value="pop">POP</option>
    <option value="rock">ROCK</option>
    <option value="jazz">JAZZ</option>
    <option value="hip-hop">HIP-HOP</option>
    <option value="indie">INDIE</option>
    <option value="classical">CLASSICAL</option>
  </select>

  <br>

  <button id="gachaButton" onclick="playGacha()">
    🎵 ガチャを回す！
  </button>

  <div id="gachaResult"></div>

  <h3>📜 ガチャ履歴</h3>
  <div id="gachaHistory"></div>
</section>
 
 
  </main>
 
  <script src="hirano-script.js"></script>
 
</body>
</html>
